# One tag = one release: the manifest to sideload, the built panes, the demo
# workbook and the container image, each proven before it is published.
# Runs in the PUBLIC repo, which holds no source: it checks out the private
# Skill-issue-HQ-dev/plsfix-dev at the same tag through a read-only deploy key
# (secret PLSFIX_SOURCE_KEY), so the release is built by Actions, never by a person.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (vX.Y.Z)"
        required: true
jobs:
  release:
    runs-on: ubuntu-latest
    # The one job that publishes: the release needs contents, the image needs packages.
    permissions:
      contents: write
      packages: write
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      # ghcr.io takes lowercase names only, and the owner is spelled Skill-issue-HQ-dev.
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Skill-issue-HQ-dev/plsfix-dev
          ssh-key: ${{ secrets.PLSFIX_SOURCE_KEY }}
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-09
        with: { toolchain: "1.98.1" }
      - run: npm ci
      - run: npm run build
      - run: npm run manifest:check
      - name: Demo workbook
        run: cargo run --quiet --manifest-path demo/Cargo.toml
      - name: Pane archive
        run: (cd dist && zip -qr "../plsfix-pane-$TAG.zip" .)
      - name: Image
        run: >
          docker build -f deploy/Dockerfile --build-arg PLSFIX_VERSION="$TAG"
          -t "$IMAGE:$TAG" -t "$IMAGE:latest" .
      - name: Smoke test the image
        run: |
          docker run -d --name plsfix -p 8804:8804 \
            -e MODELIS_PUBLIC_URL=https://example.test/ "$IMAGE:$TAG"
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8804/healthz && break; sleep 1
          done
          curl -fsS http://127.0.0.1:8804/version | tee version.json; echo
          grep -q "\"version\":\"${TAG#v}\"" version.json
          curl -fsS -o /dev/null http://127.0.0.1:8804/taskpane.html
          curl -fsS http://127.0.0.1:8804/manifest.xml > manifest.self.xml
          grep -q 'https://example.test/taskpane.html' manifest.self.xml
          if grep -q dbautomatizacijas manifest.self.xml; then
            echo "a hosted URL survived the rewrite"; exit 1
          fi
          docker logs plsfix
          docker rm -f plsfix
      - name: Compose file
        run: (cd deploy && cp .env.example .env && docker compose config -q)
      - name: Push the image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # The README's "Install: click here" lands on this page, so its notes are the install steps.
        run: |
          base="https://github.com/$GITHUB_REPOSITORY/releases/latest/download"
          cat > release-notes.txt <<EOF
          **Install**

          - **Windows**, in PowerShell: \`irm $base/plsfix-install-windows.ps1 | iex\`
          - **Mac**, in Terminal: \`curl -fsSL $base/plsfix-install-mac.command | sh\`
          - **Excel on the web**: Home > Add-ins > More Settings > Upload My Add-in, with \`manifest.prod.xml\` from the files below.

          Reopen Excel and PowerPoint: the **pls,fix** tab is on the ribbon, Ctrl+Shift+M opens the pane. \`pls.fix.Demo.Model.xlsx\` below has a "Start here" sheet that walks through every tool.
          EOF
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "pls,fix $TAG" --notes-file release-notes.txt \
            manifest.prod.xml "plsfix-pane-$TAG.zip" "demo/out/pls,fix Demo Model.xlsx" \
            "demo/deck/pls,fix Demo Deck.pptx" \
            deploy/install/plsfix-install-windows.ps1 deploy/install/plsfix-uninstall-windows.ps1 \
            deploy/install/plsfix-install-mac.command deploy/install/plsfix-uninstall-mac.command
